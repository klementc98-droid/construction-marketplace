<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XTISE">
  <!-- The X on its own, which is the one part of the XTISE wordmark that has to
       work at 16px. Two members crossing: a cross-brace, the smallest complete
       structural drawing there is, and the reason the letter was worth building
       the mark around.

       They are two different blues rather than one. At 16px a single-colour X
       is a blue blob; two weights of the same hue keep a lit member and a shaded
       one, so the crossing survives the size the icon actually ships at.

       Butt ends, not round. A mitred end reads as a cut length of steel; a
       rounded one reads as a marker pen. -->
  <rect width="32" height="32" rx="7" fill="#0B0D10"/>
  <path d="M7 7 L25 25" stroke="#5B8BFF" stroke-width="4.6" stroke-linecap="butt"/>
  <path d="M25 7 L7 25" stroke="#2563FF" stroke-width="4.6" stroke-linecap="butt"/>
</svg>
