# The only thing on this box listening to the internet.
#
# It does three jobs and deliberately not a fourth: terminate TLS, answer the
# ACME challenge so the certificate can renew, and hand everything else to
# gunicorn. Static files are served by the app through WhiteNoise — see the
# note on the middleware in settings — so there is no shared static volume
# here to drift out of date with the image.

upstream xtise {
    server web:8000;
}

# Port 80 exists to redirect and to prove the domain during renewal. Nothing
# else is answered on it.
server {
    listen 80;
    listen [::]:80;
    server_name xtise.gr www.xtise.gr;

    # Must come before the redirect: certbot fetches this over plain HTTP, and
    # a 301 to HTTPS on a certificate that is expiring is a renewal that cannot
    # complete.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www to the bare domain, at the TLS layer, so there is one canonical address
# and one set of cookies.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xtise.gr;

    ssl_certificate     /etc/letsencrypt/live/xtise.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xtise.gr/privkey.pem;

    return 301 https://xtise.gr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xtise.gr;

    ssl_certificate     /etc/letsencrypt/live/xtise.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xtise.gr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is set by Django, not here. One place decides it, and that place is
    # the one with DJANGO_HSTS_SECONDS in it — two sources for this header is
    # how a site ends up pinned to HTTPS for a year by accident.

    # A CV is a PDF and a portfolio photo is a photo; 15MB matches
    # DATA_UPLOAD_MAX_MEMORY_SIZE so the app's own error is what a user sees
    # rather than a bare nginx 413.
    client_max_body_size 15M;

    # User uploads, straight off the volume. These are the one thing WhiteNoise
    # does not serve — they are written at runtime and are not in the image.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        # An uploaded file must never be interpreted as anything but a
        # download. This is a public directory whose contents are chosen by
        # users, which is the shape of every stored-XSS through an upload.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://xtise;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is load-bearing: it is what makes Django build
        # https:// URLs, including the Google OAuth callback, which Google
        # rejects outright if the scheme is wrong. See SECURE_PROXY_SSL_HEADER.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
